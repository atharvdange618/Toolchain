name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Clack requires Node >=20.12.0; test the supported Node 20 and 22 lines.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # The pre-commit hook formats staged files only, so a Prettier upgrade
      # leaves untouched files in the old style. This catches that in the PR.
      - run: pnpm run format:check

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build
