name: Smoke

# Scaffolds real projects from the packed CLI. Weekly because versions.ts
# installs each plugin's latest release, so a new major can break users
# with no change in this repo.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Users run more than one pnpm major, and each changes install rules.
    strategy:
      fail-fast: false
      matrix:
        pnpm: ['11', '12']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      # setup refuses a version that differs from packageManager, so switch
      # the global pnpm afterwards. Outside the repo, so the pin doesn't apply.
      - run: pnpm self-update ${{ matrix.pnpm }} && pnpm --version
        working-directory: ${{ runner.temp }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm run smoke
